name: main-source-check
on:
  pull_request:
    branches: [main]
jobs:
  only-from-development:
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        if: github.head_ref != 'development'
        run: |
          echo "PRs into main must come from development (this one is from ${{ github.head_ref }})."
          exit 1