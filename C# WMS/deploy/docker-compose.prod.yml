# Production stack for the project server: MySQL, two copies of the API image that CI
# publishes from main, and nginx in front of them. Settings come from deploy/.env
# (see .env.example).
name: cargohub

# Docker keeps container logs forever by default, until the disk is full and MySQL and
# the API go down with it. This keeps at most 5 compressed files of 10 MB per container.
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

# Shared by api-a and api-b. Two copies means one can restart (deploy or crash)
# while the other keeps answering requests.
x-api: &api
  image: ghcr.io/lennardje21/inf2c-team-5:${IMAGE_TAG:-latest}
  restart: unless-stopped
  logging: *logging
  depends_on:
    mysql:
      condition: service_healthy
  environment:
    ConnectionStrings__CargoHub: Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User ID=${MYSQL_USER};Password=${MYSQL_PASSWORD}
  # No published port: requests come in through nginx.
  # The runtime image has no curl, so bash sends the request itself.
  # Two failed checks 5s apart mark the container unhealthy, after which watchdog.sh
  # restarts it. A single slow check is not enough. The 5s timeout leaves room for a
  # query that first has to read MySQL back from swap on this small server.
  healthcheck:
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
    interval: 5s
    timeout: 5s
    retries: 2
    start_period: 30s

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    logging: *logging
    # performance_schema is MySQL's built-in monitoring, which nothing here uses. Turning
    # it off saves memory on a server with only 1.6 GB.
    command: ["--performance-schema=OFF"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    # No published port: only the api containers can reach MySQL.
    volumes:
      - mysql-data:/var/lib/mysql
      - ../src/CargoHub.Api/Data/MySql/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../src/CargoHub.Api/Data/MySql/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-a: *api
  api-b: *api

  nginx:
    image: nginx:1.28
    restart: unless-stopped
    logging: *logging
    # A directory, not a single file: git replaces the file on deploy, and a file mount
    # would keep showing the old one.
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  mysql-data:
