# Spreads requests over api-a and api-b. When one is down (restarting during a deploy,
# or crashed), nginx sends the request to the other one instead.

# Docker's DNS. A recreated container gets a new IP, so nginx looks the names up again
# every 2 seconds instead of only at startup.
resolver 127.0.0.11 valid=2s ipv6=off;

# After a failed request a container is skipped for 2 seconds. Keep this short: while
# both are skipped, every request fails, even when one is already back.
upstream cargohub_api {
    zone cargohub_api 64k;
    server api-a:8080 resolve max_fails=1 fail_timeout=2s;
    server api-b:8080 resolve max_fails=1 fail_timeout=2s;
}

server {
    listen 80;
    # The API key header is called API_KEY; nginx drops headers with '_' by default.
    underscores_in_headers on;

    location / {
        proxy_pass http://cargohub_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Try the other container when this one refuses the connection or is shutting down.
        # POST/PUT/DELETE are only retried when the request never reached the first one.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;
    }
}
